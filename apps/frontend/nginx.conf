server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Default is 1m — too small for a full paint-catalog JSON import or a
    # decent-resolution box photo/instruction PDF upload.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://backend:3001;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
