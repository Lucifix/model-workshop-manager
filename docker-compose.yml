services:
  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=workshop
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: /data/database/workshop.db
      DATA_DIR: /data
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /backups
      UPCITEMDB_ENABLED: ${UPCITEMDB_ENABLED:-false}
      AUTH_USERNAME: ${AUTH_USERNAME:?Set AUTH_USERNAME in your .env or stack environment — see .env.example}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in your .env or stack environment — see .env.example}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in your .env or stack environment — see .env.example}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - ${WORKSHOP_DATA_DIR:-workshop-data}:/data
      - ${BACKUP_DIR:-./backups}:/backups
    expose:
      - "3001"

  frontend:
    build:
      context: ./apps/frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HOST_PORT:-8080}:80"

  backup:
    image: offen/docker-volume-backup:v2
    restart: unless-stopped
    environment:
      BACKUP_CRON: "0 3 * * *"
      BACKUP_FILENAME: "workshop-backup-%Y-%m-%d_%H-%M-%S.tar.gz"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
      BACKUP_STOP_DURING_BACKUP_LABEL: "workshop"
      BACKUP_PRUNING_LEEWAY: "5m"
    volumes:
      - ${WORKSHOP_DATA_DIR:-workshop-data}:/backup/workshop-data:ro
      - ${BACKUP_DIR:-./backups}:/archive
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  workshop-data:
    name: workshop-data
